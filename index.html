<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mini Runner v0.2</title>
  <link rel="preload" href="game.js" as="script">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Mobile controls -->
  <div class="controls" id="controls">
    <div class="leftpad">
      <button class="btn" id="leftBtn" aria-label="Влево">⟵</button>
      <button class="btn" id="rightBtn" aria-label="Вправо">⟶</button>
    </div>
    <div class="rightpad">
      <button class="btn" id="jumpBtn" aria-label="Прыжок">⤒</button>
      <button class="btn small" id="shootBtn" aria-label="Выстрел">⦿</button>
    </div>
  </div>

  <div class="hint" id="hint">Десктоп: ф/в или ←/→ — идти, ПРОБЕЛ — прыжок, ENTER — выстрел</div>

  <script src="game.js"></script>
</body>
</html>
