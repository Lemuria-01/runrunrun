<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mini Runner v0.1</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #87c5ff; /* sky */
      -webkit-touch-callout: none; -webkit-user-select: none; -ms-user-select: none; user-select: none;
    }
    #game {
      display: block; width: 100vw; height: 100vh; touch-action: none; /* we'll handle gestures */
      background: linear-gradient(#87c5ff 70%, #9ad1ff 100%);
    }
    /* Mobile controls */
    .controls {
      position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none; padding: env(safe-area-inset-bottom, 8px) 12px 12px; display: flex; justify-content: space-between; gap: 12px;
    }
    .leftpad, .rightpad { display: flex; gap: 12px; pointer-events: auto; }
    .btn {
      width: 64px; height: 64px; border-radius: 16px; border: 2px solid rgba(0,0,0,.2);
      background: rgba(255,255,255,.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: grid; place-items: center; font: 700 18px/1 system-ui, -apple-system, Segoe UI, Roboto; color: #14385b;
      box-shadow: 0 6px 16px rgba(0,0,0,.15); touch-action: manipulation;
    }
    .btn:active { transform: translateY(1px); }
    .btn.small { width: 56px; height: 56px; }

    /* Hide controls on wide screens (desktop), show on narrow (mobile) */
    @media (min-width: 900px) {
      .controls { display: none; }
    }

    .hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.3); color: #fff; padding: 6px 10px; border-radius: 8px; font: 500 12px/1.3 system-ui, -apple-system, Segoe UI, Roboto; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Mobile controls -->
  <div class="controls" id="controls">
    <div class="leftpad">
      <button class="btn" id="leftBtn" aria-label="Влево">⟵</button>
      <button class="btn" id="rightBtn" aria-label="Вправо">⟶</button>
    </div>
    <div class="rightpad">
      <button class="btn" id="jumpBtn" aria-label="Прыжок">⤒</button>
      <button class="btn small" id="shootBtn" aria-label="Выстрел">⦿</button>
    </div>
  </div>

  <div class="hint" id="hint">Десктоп: ф/в или ←/→ — идти, ПРОБЕЛ — прыжок, ENTER — выстрел</div>

  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // DPR-aware resize
    const state = {
      w: 0, h: 0, dpr: Math.max(1, Math.min(window.devicePixelRatio || 1, 2)),
      keys: { left: false, right: false, jump: false, shoot: false },
      groundY: 0,
      lastTime: 0,
      levelScroll: 0, // simple parallax scroll
    };

    function resize() {
      state.dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
      state.w = Math.floor(window.innerWidth);
      state.h = Math.floor(window.innerHeight);
      canvas.width = state.w * state.dpr;
      canvas.height = state.h * state.dpr;
      canvas.style.width = state.w + 'px';
      canvas.style.height = state.h + 'px';
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      state.groundY = Math.floor(state.h * 0.8);
    }
    window.addEventListener('resize', resize);
    resize();

    // Simple player
    const player = {
      x: 80,
      y: 0,
      w: 40,
      h: 54,
      vx: 0,
      vy: 0,
      speed: 220,   // px/s
      jumpV: -520,  // px/s
      maxVy: 900,
      onGround: false,
      facing: 1, // 1 right, -1 left
      shootCooldown: 0,
    };

    // bullets
    const bullets = [];

    const GRAVITY = 1500; // px/s^2
    const FRICTION = 0.86;

    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

    function handleInput(dt) {
      const accel = player.speed;
      if (state.keys.left && !state.keys.right) {
        player.vx = -accel;
        player.facing = -1;
      } else if (state.keys.right && !state.keys.left) {
        player.vx = accel;
        player.facing = 1;
      } else {
        player.vx *= 0.86; // glide to stop
        if (Math.abs(player.vx) < 5) player.vx = 0;
      }

      // Jump (edge-triggered)
      if (state.keys.jump && player.onGround) {
        player.vy = player.jumpV;
        player.onGround = false;
      }

      // Shoot
      if (state.keys.shoot && player.shootCooldown <= 0) {
        bullets.push({
          x: player.x + player.w/2 + player.facing*22,
          y: player.y + player.h*0.45,
          r: 5,
          vx: 520 * player.facing,
          life: 1.6, // seconds
        });
        player.shootCooldown = 0.22; // 220ms cadence
      }
    }

    function physics(dt) {
      // integrate
      player.vy += 1500 * dt;
      player.vy = clamp(player.vy, -2000, player.maxVy);
      player.x += player.vx * dt;
      player.y += player.vy * dt;

      // world bounds (horizontally keep inside screen for v0.1)
      player.x = clamp(player.x, 10, state.w - player.w - 10);

      // ground collision
      const groundTop = state.groundY - player.h;
      if (player.y >= groundTop) {
        player.y = groundTop;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      // bullets update
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.life -= dt;
        if (b.life <= 0 || b.x < -20 || b.x > state.w + 20) bullets.splice(i, 1);
      }

      // parallax scroll for background feeling
      state.levelScroll = clamp(state.levelScroll + player.vx * dt * 0.15, -1e9, 1e9);

      if (player.shootCooldown > 0) player.shootCooldown -= dt;
    }

    function drawBackground() {
      const w = state.w, h = state.h; const gY = state.groundY;

      // mid skyline (parallax layer 1)
      ctx.save();
      ctx.translate(-(state.levelScroll*0.5)%800, 0);
      drawCityStrip(0, h*0.35, 800, h*0.45, '#6aa0c9');
      ctx.restore();

      // near skyline (parallax layer 2)
      ctx.save();
      ctx.translate(-(state.levelScroll*0.8)%600, 0);
      drawCityStrip(0, h*0.45, 600, h*0.55, '#4e84ac');
      ctx.restore();

      // asphalt road
      ctx.fillStyle = '#3d3d3d';
      ctx.fillRect(0, gY, w, h - gY);
      // lane markings
      ctx.strokeStyle = '#e7e7e7';
      ctx.lineWidth = 4;
      const dashW = 28, gap = 20; let offset = (-state.levelScroll*1.2) % (dashW+gap);
      ctx.setLineDash([dashW, gap]);
      ctx.beginPath();
      ctx.moveTo(offset, gY + 26);
      ctx.lineTo(w + dashW, gY + 26);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawCityStrip(x, y, stripW, stripH, color){
      const w = state.w;
      ctx.fillStyle = color;
      // Use deterministic pattern to avoid flicker
      const rnd = (seed) => {
        let s = seed;
        return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
      };
      const rand = rnd(12345);
      for (let i = -1; i < Math.ceil((w/stripW))+2; i++) {
        const baseX = x + i*stripW;
        for (let b = 0; b < 10; b++) {
          const bw = 30 + rand()*40;
          const bh = stripH*0.3 + rand()*stripH*0.5;
          const bx = baseX + b* (stripW/10) + rand()*10;
          const by = y + (stripH - bh);
          ctx.fillRect(bx, by, bw, bh);
          // windows
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          const rows = Math.floor(bh/18), cols = Math.floor(bw/14);
          for (let r = 1; r < rows; r++) {
            for (let c = 1; c < cols; c++) {
              ctx.fillRect(bx + c*12, by + r*14, 4, 6);
            }
          }
          ctx.fillStyle = color;
        }
      }
    }

    function drawPlayer(){
      const p = player;
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(p.x + p.w/2, state.groundY + 6, p.w*0.45, 6, 0, 0, Math.PI*2);
      ctx.fill();

      // legs
      ctx.fillStyle = '#263238';
      ctx.fillRect(p.x + 10, p.y + p.h - 20, 10, 20);
      ctx.fillRect(p.x + p.w - 20, p.y + p.h - 20, 10, 20);
      // torso
      ctx.fillStyle = '#1976d2';
      ctx.fillRect(p.x + 6, p.y + 18, p.w - 12, 28);
      // head
      ctx.fillStyle = '#ffddb0';
      ctx.beginPath();
      ctx.arc(p.x + p.w/2, p.y + 14, 12, 0, Math.PI*2);
      ctx.fill();
      // eye
      ctx.fillStyle = '#0b2540';
      const eyeX = p.x + p.w/2 + (p.facing>0?4:-8);
      ctx.fillRect(eyeX, p.y + 10, 4, 4);
      // arm + gun
      ctx.fillStyle = '#ffddb0';
      const armX = p.x + (p.facing>0 ? p.w - 8 : 8);
      ctx.fillRect(armX - 6, p.y + 26, 12, 6);
      ctx.fillStyle = '#424242';
      ctx.fillRect(armX + (p.facing>0?2:-8), p.y + 24, 8, 10);
    }

    function drawBullets(){
      ctx.fillStyle = '#ffd54f';
      bullets.forEach(b => {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 0.15; ctx.fillRect(b.x - b.vx*0.03, b.y-1, b.vx*0.03, 2); ctx.globalAlpha = 1;
      });
    }

    function frame(t){
      if (!state.lastTime) state.lastTime = t;
      let dt = (t - state.lastTime) / 1000;
      state.lastTime = t;
      dt = Math.min(dt, 1/30);

      handleInput(dt);
      physics(dt);

      ctx.clearRect(0,0,state.w,state.h);
      drawBackground();
      drawPlayer();
      drawBullets();

      requestAnimationFrame(frame);
    }

    function setKey(name, pressed){
      state.keys[name] = pressed;
    }

    const LEFT_KEYS = new Set(['ArrowLeft','a','A','ф','Ф']);
    const RIGHT_KEYS = new Set(['ArrowRight','d','D','в','В']);

    window.addEventListener('keydown', (e) => {
      if (LEFT_KEYS.has(e.key)) { setKey('left', true); e.preventDefault(); }
      if (RIGHT_KEYS.has(e.key)) { setKey('right', true); e.preventDefault(); }
      if (e.code === 'Space') { setKey('jump', true); e.preventDefault(); }
      if (e.code === 'Enter') { setKey('shoot', true); e.preventDefault(); }
    }, { passive: false });
    window.addEventListener('keyup', (e) => {
      if (LEFT_KEYS.has(e.key)) { setKey('left', false); e.preventDefault(); }
      if (RIGHT_KEYS.has(e.key)) { setKey('right', false); e.preventDefault(); }
      if (e.code === 'Space') { setKey('jump', false); e.preventDefault(); }
      if (e.code === 'Enter') { setKey('shoot', false); e.preventDefault(); }
    }, { passive: false });

    function bindButton(id, key){
      const el = document.getElementById(id);
      const press = (ev) => { setKey(key, true); ev.preventDefault(); };
      const release = (ev) => { setKey(key, false); ev.preventDefault(); };
      ['pointerdown','touchstart','mousedown'].forEach(t => el.addEventListener(t, press, { passive:false }));
      ['pointerup','pointercancel','touchend','touchcancel','mouseup','mouseleave'].forEach(t => el.addEventListener(t, release, { passive:false }));
    }
    bindButton('leftBtn', 'left');
    bindButton('rightBtn', 'right');
    bindButton('jumpBtn', 'jump');
    bindButton('shootBtn', 'shoot');

    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile) document.getElementById('hint').style.display = 'none';

    player.y = state.groundY - player.h;
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
